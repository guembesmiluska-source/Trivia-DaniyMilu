<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dani y Milu 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe3ec;--bg2:#fff4e8;--card:#ffffffcc;--ink:#4a1f33;--soft:#8a5a70;--p1:#e8517f;--p2:#f59ab5;--p3:#ffc2d4;--ok:#2e9e6b;--bad:#d64550;--okbg:#dff5ea;--badbg:#fde3e5;--border:#f3c3d2;--paper:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1220;--bg2:#1b0e17;--card:#3a1c2cd9;--ink:#ffe8f0;--soft:#d9a9bd;--p1:#ff6f9a;--p2:#c9456f;--p3:#7a2d4a;--okbg:#17372a;--badbg:#42191e;--border:#6b3149;--paper:#fdf1f5}}
:root[data-theme="dark"]{--bg1:#2a1220;--bg2:#1b0e17;--card:#3a1c2cd9;--ink:#ffe8f0;--soft:#d9a9bd;--p1:#ff6f9a;--p2:#c9456f;--p3:#7a2d4a;--okbg:#17372a;--badbg:#42191e;--border:#6b3149;--paper:#fdf1f5}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100%;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:Nunito,system-ui,sans-serif;display:flex;justify-content:center;padding:20px 16px 40px}
.wrap{width:100%;max-width:460px;text-align:center}
h1{font-family:'Playfair Display',Georgia,serif;font-size:2.2rem;margin:6px 0 2px;color:var(--p1)}
.sub{color:var(--soft);margin:0 0 10px}
.date{display:inline-block;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:6px 16px;font-weight:700;text-transform:capitalize;font-size:.95rem}
.score{margin:10px 0 0;color:var(--soft);font-size:.9rem}
.pol{background:var(--paper);padding:6px 6px 22px;border-radius:6px;box-shadow:0 6px 16px #4a1f3333;flex:none}
.pol img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:3px}
.pol small{display:block;position:absolute;bottom:3px;left:0;right:0;font-family:'Playfair Display',Georgia,serif;font-style:italic;color:#8a5a70;font-size:.72rem}
.hero{display:flex;justify-content:center;margin:12px 0 4px;padding:8px 0}
.hero .pol{width:31%;max-width:140px;position:relative;margin:0 -6px}
.hero .pol:nth-child(1){transform:rotate(-7deg)}
.hero .pol:nth-child(2){transform:translateY(-8px) rotate(2deg);z-index:2}
.hero .pol:nth-child(3){transform:rotate(7deg)}
.stage{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:26px auto 18px}
.pointer{position:absolute;top:-14px;left:50%;transform:translateX(-50%);z-index:3;font-size:30px;filter:drop-shadow(0 2px 2px #0003);line-height:1;color:var(--p1)}
.wheel{position:absolute;inset:0;border-radius:50%;border:6px solid #fff;box-shadow:0 10px 30px #e8517f55;transition:transform 4.2s cubic-bezier(.12,.7,.1,1);
background:conic-gradient(var(--p1) 0 36deg,var(--p3) 36deg 72deg,var(--p1) 72deg 108deg,var(--p3) 108deg 144deg,var(--p1) 144deg 180deg,var(--p3) 180deg 216deg,var(--p1) 216deg 252deg,var(--p3) 252deg 288deg,var(--p1) 288deg 324deg,var(--p3) 324deg 360deg)}
.lab{position:absolute;left:50%;top:50%;width:0;height:0}
.lab span{position:absolute;left:-14px;top:-122px;width:28px;text-align:center;font-size:1.3rem}
.hub{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px;border-radius:50%;background:#fff;z-index:2;display:grid;place-items:center;font-size:28px;box-shadow:0 2px 10px #0003}
button{font:inherit;cursor:pointer}
.spin{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border:0;border-radius:999px;padding:14px 34px;font-weight:700;font-size:1.05rem;box-shadow:0 8px 20px #e8517f55}
.spin:disabled{opacity:.6;cursor:default}
.card{background:var(--card);backdrop-filter:blur(6px);border:1px solid var(--border);border-radius:22px;padding:22px 18px;margin-top:22px;text-align:left;display:none;box-shadow:0 10px 30px #e8517f22}
.card.show{display:block;animation:up .5s ease}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.q{font-family:'Playfair Display',Georgia,serif;font-size:1.3rem;margin:0 0 14px;text-align:center;line-height:1.3}
.opt{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);border:2px solid var(--border);border-radius:14px;padding:12px 14px;margin:8px 0;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--p1)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.fill{display:flex;gap:8px}
.fill input{flex:1;min-width:0;font:inherit;padding:12px 14px;border-radius:14px;border:2px solid var(--border);background:transparent;color:var(--ink)}
.fill input:focus{outline:none;border-color:var(--p1)}
.fill input.ok{background:var(--okbg);border-color:var(--ok)}
.fill input.bad{background:var(--badbg);border-color:var(--bad)}
.fill button{background:var(--p1);color:#fff;border:0;border-radius:14px;padding:0 18px;font-weight:700}
.fill button:disabled{opacity:.5}
.res{text-align:center;margin-top:14px;font-weight:700;font-size:1.05rem;min-height:1.4em;white-space:pre-line}
.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.reveal{display:none;width:150px;margin:16px auto 0;position:relative;transform:rotate(-3deg)}
.reveal.show{display:block;animation:up .6s ease}
.strip{display:flex;gap:12px;overflow-x:auto;padding:14px 6px 10px;margin-top:30px;scroll-snap-type:x mandatory}
.strip .pol{width:120px;position:relative;scroll-snap-align:center}
.strip .pol:nth-child(odd){transform:rotate(-2deg)}.strip .pol:nth-child(even){transform:rotate(2deg)}
.test{margin-top:20px;background:none;border:0;color:var(--soft);font-size:.8rem;text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <h1>Dani y Milu 💕</h1>
  <p class="sub">¿Cuánto me conoces? Una pregunta nueva cada día</p>
  <div class="hero" id="hero"></div>
  <div class="date" id="date"></div>
  <p class="score" id="score"></p>
  <div class="stage">
    <div class="pointer">▼</div>
    <div class="wheel" id="wheel"></div>
    <div class="hub">💘</div>
  </div>
  <button class="spin" id="spin">Girar la ruleta</button>
  <div class="card" id="card">
    <p class="q" id="q"></p>
    <div id="opts"></div>
    <div class="res" id="res"></div>
    <div class="pol reveal" id="reveal"><img id="rimg" alt=""><small>Dani y Milu 💕</small></div>
  </div>
  <div class="strip" id="strip"></div>
  <button class="test" id="test">Probar otra pregunta (modo prueba)</button>
</div>

/* t:"o" opciones (a = índices correctos o "all") · t:"f" completar (k = palabras válidas) · msg = mensaje extra · show = respuesta a mostrar si falla */
const QS=[
 {t:"o",q:"¿Cuál es mi comida favorita?",o:["Pizza","Ceviche","Fideos a lo alfredo","Lomo saltado"],a:[2],show:"Fideos a lo alfredo"},
 {t:"o",q:"¿Cuál es mi color favorito?",o:["Rosado","Rojo vino","Azul marino","Verde oliva"],a:[1],show:"Rojo vino"},
 {t:"o",q:"¿Cuál es mi postre favorito?",o:["Tres leches","Alfajores","Helado de fresa","Red velvet"],a:[1,3],show:"Alfajores o red velvet"},
 {t:"o",q:"¿Qué prefiero hacer un domingo?",o:["Salir a pasear","Hacer deporte","Cama, ver pelis y comer","Ir de compras"],a:[2],show:"Cama, ver pelis y comer"},
 {t:"o",q:"¿Cuál es mi mayor miedo?",o:["Las alturas","Sentirme sola","Los bichos","La oscuridad"],a:[1],show:"Sentirme sola"},
 {t:"o",q:"¿Qué género de música escucho más?",o:["Rock","Reggaetón","Salsa","Pop"],a:[3],show:"Pop"},
 {t:"o",q:"¿Cuál es mi serie o película favorita actualmente?",o:["Mindhunter","El cuento de la criada","Avengers: Endgame"],a:[1],show:"El cuento de la criada"},
 {t:"o",q:"¿Qué pido siempre en Starbucks?",o:["Frappuccino de moca","Chai Latte","Caramel Macchiato","Latte de vainilla"],a:[2],show:"Caramel Macchiato"},
 {t:"o",q:"¿Soy más de…?",o:["Montaña","Playa","Ciudad","Campo"],a:[1],show:"Playa"},
 {t:"f",q:"De pequeña yo me creía…",k:["princesa"],show:"Princesa"},
 {t:"f",q:"Mi animal favorito es…",k:["perro","perros","perrito","perritos"],show:"El perro"},
 {t:"f",q:"Mi mayor sueño profesional es…",k:["nobel"],show:"Ganar un Nobel"},
 {t:"o",q:"¿Dónde fue nuestra primera cita?",o:["Antica","Troppo","Sienna Bakery","Panchita","Arirang"],a:[2],show:"Sienna Bakery"},
 {t:"o",q:"¿Quién dijo “te amo” primero?",o:["Tú","Yo","Los dos a la vez"],a:[1],show:"Yo"},
 {t:"o",q:"¿Cuál fue el primer regalo que yo te di?",o:["Mono tejido","Un beso","Una carta","Pollito de crochet"],a:[3],show:"Pollito de crochet"},
 {t:"o",q:"¿Qué plan es el que más me gusta hacer contigo?",o:["Salir a bailar","Estar en tu cama viendo pelis y comer","Ir a la playa","Salir a comer afuera"],a:[1],msg:"…aunque tú odies ese plan 😜",show:"Estar en tu cama viendo pelis y comer"},
 {t:"o",q:"¿Quién de los dos para yendo al baño?",o:["Milu","Dani","Los dos igual"],a:[1],show:"Dani"},
 {t:"f",q:"Nos conocimos en la…",k:["universidad","uni","la u"],show:"Universidad"},
 {t:"f",q:"La canción que nos representa es…",k:["serrucho"],show:"Serrucho"},
 {t:"f",q:"El apodo cariñoso que más uso contigo es…",k:["amor"],show:"Mi amor"},
 {t:"o",q:"¿Qué es lo que más me gusta de ti?",o:["Tus ojos","Tu olor","Tu sonrisa","Tu personalidad"],a:"all",msg:"¡Todo! Me gusta todo de ti 💕"},
 {t:"f",q:"¿Qué es lo que me gusta comer de ti?",k:["una","unas"],show:"Tus uñas"},
 {t:"o",q:"¿Qué superpoder quiero tener?",o:["Leer mentes","Hacerme invisible","Teletransportarme","Telekinesis"],a:[2],show:"Teletransportarme"},
 {t:"f",q:"¿Cuál es el mejor recuerdo que tenemos juntos?",any:true,msg:"Todos los momentos contigo son los mejores recuerdos. Te amo 💗"}
];
const N=QS.length,$=id=>document.getElementById(id);
const today=new Date(),pad=n=>String(n).padStart(2,"0");
const key=`${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
const dayNum=Math.floor((new Date(today.getFullYear(),today.getMonth(),today.getDate())-new Date(2026,0,1))/864e5);
let idx=((dayNum%N)+N)%N,test=false,spinning=false;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
$("date").textContent=today.toLocaleDateString("es-PE",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const pol=(i,cap)=>`<div class="pol"><img src="${PH[i]}" alt="">${cap?"<small>"+cap+"</small>":""}</div>`;
if(PH.length){
  $("hero").innerHTML=[1,7,2].map(i=>pol(i%PH.length)).join("");
  $("strip").innerHTML=PH.map((_,i)=>pol(i)).join("");
}else{$("hero").style.display="none";$("strip").style.display="none"}
const wheel=$("wheel"),EM=["💕","🌸","💌","🍓","✨","🧸","🌷","💘","🎀","🐶"];
EM.forEach((e,i)=>{const l=document.createElement("div");l.className="lab";l.style.transform=`rotate(${i*36+18}deg)`;l.innerHTML=`<span>${e}</span>`;wheel.appendChild(l)});
let spins=0;
function setWheel(i,animate){
  wheel.style.transition=animate?"":"none";
  spins=animate?spins+5:0;
  const seg=i%10;
  wheel.style.transform=`rotate(${spins*360-(seg*36+18)}deg)`;
}
function score(){let c=0,t=0;
  try{for(let k=0;k<localStorage.length;k++){const n=localStorage.key(k);if(n&&n.startsWith("tp:")){t++;try{if(JSON.parse(localStorage.getItem(n)).ok)c++}catch(e){}}}}catch(e){}
  $("score").textContent=t?`Aciertos: ${c} de ${t} 💗`:"";}
function showQ(){
  const d=QS[idx];$("q").textContent=d.q;$("res").textContent="";$("res").className="res";$("reveal").classList.remove("show");
  const box=$("opts");box.innerHTML="";
  const saved=test?null:store.get("tp:"+key);
  if(d.t==="o"){
    d.o.forEach((t,i)=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>answer(i);box.appendChild(b)});
  }else{
    box.innerHTML='<div class="fill"><input id="inp" placeholder="Escribe tu respuesta…" autocomplete="off"><button id="go">Responder</button></div>';
    $("go").onclick=()=>{const v=$("inp").value.trim();if(v)answer(v)};
    $("inp").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
  }
  $("card").classList.add("show");
  if(saved){try{mark(JSON.parse(saved).sel)}catch(e){}}
}
function isOk(sel){
  const d=QS[idx];
  if(d.t==="o")return d.a==="all"||d.a.includes(sel);
  if(d.any)return true;
  const s=norm(sel);
  return d.k.some(k=>new RegExp("(^|[^a-z0-9])"+norm(k)+"([^a-z0-9]|$)").test(s));
}
function mark(sel){
  const d=QS[idx],ok=isOk(sel);
  if(d.t==="o"){
    [...$("opts").children].forEach((b,i)=>{b.disabled=true;if(d.a==="all"||d.a.includes(i))b.classList.add("ok");else if(i===sel)b.classList.add("bad")});
  }else{
    const inp=$("inp");inp.value=sel;inp.disabled=true;$("go").disabled=true;inp.classList.add(ok?"ok":"bad");
  }
  $("res").className="res "+(ok?"ok":"bad");
  $("res").textContent=ok?(d.any?"":"¡Correcto! Me conoces muy bien 🥰")+(d.msg?(d.any?"":"\n")+d.msg:""):"¡Incorrecto! 😅 La respuesta era: "+d.show;
  if(PH.length){$("rimg").src=PH[(dayNum+idx+(ok?0:3))%PH.length];$("reveal").classList.add("show")}
}
function answer(sel){
  if(!test){if(store.get("tp:"+key))return;store.set("tp:"+key,JSON.stringify({sel,ok:isOk(sel)?1:0}));score()}
  mark(sel);
}
function spin(){
  if(spinning)return;spinning=true;$("spin").disabled=true;$("card").classList.remove("show");
  setWheel(idx,true);
  setTimeout(()=>{spinning=false;showQ();$("spin").textContent=test?"Girar otra vez":"Ya giraste hoy ✨";$("spin").disabled=!test},4300);
}
$("spin").onclick=spin;
